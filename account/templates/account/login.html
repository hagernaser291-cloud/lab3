{% extends "base.html" %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<section class="card" style="max-width:560px; margin:30px auto;">
    <div class="eyebrow">WELCOME BACK</div>
    <h1>تسجيل الدخول</h1>
    <p class="lead">أدخل بياناتك للوصول إلى مكتبتك الرقمية.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">دخول</button>
    </form>
</section>
{% endblock %}
