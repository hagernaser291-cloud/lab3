<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}مكتبتي الرقمية{% endblock %}</title>

    <style>
        :root {
            --navy: #151a35;
            --purple: #5b4bdb;
            --purple-dark: #4032a4;
            --soft-purple: #efedff;
            --cream: #f7f8fc;
            --white: #ffffff;
            --text: #172033;
            --muted: #6b7280;
            --border: #e8eaf2;
            --green: #178357;
            --red: #c0392b;
            --shadow: 0 14px 38px rgba(24, 32, 72, .08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background: var(--cream);
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }

        a { color: inherit; }

        .site-header {
            color: #fff;
            padding: 18px 6%;
            background: linear-gradient(135deg, var(--navy), #30256e 60%, var(--purple));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
        }

        .brand {
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.35rem;
        }

        .brand small {
            display: block;
            margin-top: 4px;
            opacity: .7;
            font-size: .72rem;
            font-weight: 400;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .nav a { text-decoration: none; opacity: .9; }
        .nav a:hover { opacity: 1; }

        .nav-button,
        .button {
            display: inline-block;
            border: 0;
            border-radius: 11px;
            padding: 10px 16px;
            color: #fff;
            background: var(--purple);
            text-decoration: none;
            cursor: pointer;
            font-weight: 700;
            transition: .2s ease;
        }

        .nav-button { background: rgba(255,255,255,.16); }
        .button:hover, .nav-button:hover {
            background: var(--purple-dark);
            transform: translateY(-1px);
        }

        .page {
            width: min(1180px, 92%);
            margin: 0 auto;
            padding: 38px 0 64px;
        }

        .card {
            padding: 28px;
            margin-bottom: 24px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
        }

        .hero {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 26px;
            align-items: center;
            background: linear-gradient(135deg, #fff, #f0efff);
        }

        .eyebrow {
            color: var(--purple);
            font-size: .8rem;
            font-weight: 800;
            letter-spacing: .12em;
        }

        h1, h2, h3 { margin-top: 0; }
        h1 { font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.1; margin-bottom: 15px; }
        h2 { font-size: 1.55rem; }

        .lead {
            color: var(--muted);
            font-size: 1.08rem;
            line-height: 1.9;
        }

        .hero-art {
            min-height: 220px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: rgba(91, 75, 219, .11);
            font-size: 7rem;
        }

        .search {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .search input {
            flex: 1;
            min-width: 0;
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 13px 15px;
            font-size: 1rem;
            outline: none;
        }

        .search input:focus,
        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(91, 75, 219, .12);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat {
            padding: 19px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #fff;
        }

        .stat strong {
            display: block;
            margin-top: 5px;
            color: var(--purple);
            font-size: 1.55rem;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 18px;
        }

        .book-card {
            padding: 19px;
            border: 1px solid var(--border);
            border-radius: 17px;
            background: #fff;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(24, 32, 72, .12);
        }

        .book-cover {
            height: 132px;
            display: grid;
            place-items: center;
            margin-bottom: 17px;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(145deg, #30256e, #8a7ff2);
            font-size: 3.4rem;
        }

        .book-title {
            margin-bottom: 7px;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .meta {
            color: var(--muted);
            font-size: .93rem;
            line-height: 1.9;
        }

        .tag {
            display: inline-block;
            padding: 5px 11px;
            border-radius: 99px;
            color: var(--purple-dark);
            background: var(--soft-purple);
            font-size: .78rem;
            font-weight: 700;
        }

        .available { color: var(--green); font-weight: 700; }
        .unavailable { color: var(--red); font-weight: 700; }
        .empty { padding: 35px; color: var(--muted); text-align: center; }

        form p { margin: 0 0 15px; }
        form label { display: block; margin-bottom: 7px; font-weight: 700; }
        form input, form textarea, form select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 13px;
            font: inherit;
        }
        form input[type="checkbox"] { width: auto; }
        .helptext { color: var(--muted); font-size: .85rem; }
        .errorlist { color: var(--red); margin: 5px 0 10px; padding-right: 20px; }

        /* تنسيق صفحة الإشعارات */
        .page-card {
            max-width: 900px;
            margin: 32px auto;
            padding: 28px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
        }

        .page-heading { margin-bottom: 22px; }

        .page-heading h1 {
            margin-bottom: 8px;
            color: var(--navy);
            font-size: 2rem;
        }

        .page-heading p { color: var(--muted); }

        .notification-card {
            margin-top: 14px;
            padding: 18px;
            border: 1px solid #eadfd6;
            border-radius: 16px;
            background: #fffaf6;
        }

        .notification-card.unread {
            border-right: 5px solid var(--purple);
        }

        .notification-card h2 {
            margin: 0 0 8px;
            color: var(--navy);
            font-size: 1.1rem;
        }

        .notification-card p {
            margin: 0 0 8px;
            color: var(--muted);
            line-height: 1.8;
        }

        .notification-card small {
            color: var(--purple);
            font-weight: 700;
        }

        @media (max-width: 720px) {
            .site-header { display: block; }
            .nav { margin-top: 16px; }
            .hero { display: block; }
            .hero-art { margin-top: 22px; }
            .stats { grid-template-columns: 1fr; }
            .search { flex-direction: column; }
            .section-heading {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'books:home' %}">
            مكتبتي الرقمية
            <small>اكتشف كتابك القادم</small>
        </a>

        <nav class="nav">
            <a href="{% url 'books:home' %}">الرئيسية</a>

            {% if user.is_authenticated %}
                <span>مرحبًا، {{ user.username }}</span>
                <a class="nav-button" href="{% url 'account:notifications' %}">الإشعارات</a>
                <a class="nav-button" href="{% url 'account:logout' %}">تسجيل الخروج</a>
            {% else %}
                <a class="nav-button" href="{% url 'account:login' %}">تسجيل الدخول</a>
                <a class="nav-button" href="{% url 'account:register' %}">إنشاء حساب</a>
            {% endif %}
        </nav>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
